name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# CloudFormation rejects a second update while one is in progress, so let a
# running deploy finish rather than cancelling it half way through a stack update.
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The fast projects only. PuckDrop.E2ETests boots the real AppHost and a
      # headless browser, which belongs in its own workflow, not in a deploy gate.
      - name: Test
        run: dotnet test --configuration Release --verbosity normal -- --filter-not-trait Category=E2E --ignore-exit-code=8
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-24.04-arm
    # Must match the subject claim the deployment role trusts. Without it the
    # token's sub is the branch form and AssumeRoleWithWebIdentity is denied.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Aspire shells out to the CDK CLI for the deploy step and fails outright
      # if it is missing. It checks the Node version before doing so.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk@2
      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: puckdrop-deploy-${{ github.run_id }}
      - name: Deploy
        run: aspire deploy --non-interactive --nologo --include-exception-details
