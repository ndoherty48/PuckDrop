name: Pull-Request

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: pull-request-ci
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal -- --filter-not-trait Category=E2E --ignore-exit-code=8
      # Aspire's AddAWSLambdaFunction shells out to this tool to run the function locally, and
      # the API Gateway emulator comes from the same package. Without it nothing serves the
      # Lambda route, so api-gateway never passes its health check and the fixture times out.
      - name: Install AWS Lambda Test Tool
        run: dotnet tool install --global Amazon.Lambda.TestTool --version 0.15.0
      # Playwright ships no browser with the NuGet package. --with-deps also pulls the system
      # libraries headless Chromium needs, which a bare runner doesn't have.
      - name: Install Playwright browsers
        run: pwsh tests/PuckDrop.E2ETests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps
      - name: E2E Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --project tests/PuckDrop.E2ETests/PuckDrop.E2ETests.csproj --retry-failed-tests 1 --retry-failed-tests-delay 5s
